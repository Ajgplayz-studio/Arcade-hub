<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Switch OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Status Bar (Switch Style) */
        .status-bar {
            height: 48px;
            background-color: #121212;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            font-size: 15px;
            color: #dcdcdc;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background: #e60012;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(230,0,18,0.4);
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            color: #aaa;
        }

        /* Main Home Screen (Switch Layout) */
        .home-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Switch App Grid Ribbon */
        .app-grid {
            display: flex;
            gap: 22px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            max-width: 900px;
        }

        /* Authentic Switch Tile Style */
        .app-icon {
            width: 140px;
            height: 140px;
            background-color: #2b2b2b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
            border: 4px solid #2b2b2b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .app-icon:hover {
            transform: translateY(-6px) scale(1.03);
            background-color: #353535;
            border-color: #ffffff;
        }

        .app-icon.selected {
            transform: translateY(-6px) scale(1.03);
            border-color: #ffffff;
        }

        .app-icon .icon-graphic {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border-radius: 10px;
            background: #1e1e1e;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
        }

        .app-icon span {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #d1d1d1;
            letter-spacing: 0.3px;
            text-align: center;
            width: 100%;
            padding: 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Switch Footer / Controller Hint Bar */
        .switch-footer {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            background-color: #121212;
            color: #888;
            font-size: 13px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-btn {
            background: #333;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #444;
        }

        /* App View Windows */
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .app-header {
            height: 60px;
            background-color: #242424;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 2px solid #333;
        }

        .back-btn {
            background: #e60012;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: #ff1a2b;
        }

        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Codes App Specific UI */
        .codes-box {
            background: #242424;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            border: 1px solid #333;
        }

        .codes-box h2 {
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 600;
        }

        .codes-box p {
            color: #999;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .code-input {
            width: 100%;
            padding: 14px;
            font-size: 26px;
            text-align: center;
            letter-spacing: 10px;
            background: #141414;
            border: 2px solid #3b3b3b;
            color: white;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
        }

        .code-input:focus {
            border-color: #e60012;
        }

        .submit-code-btn {
            width: 100%;
            padding: 12px;
            background: #e60012;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-code-btn:hover {
            background: #ff1a2b;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        /* Galaxy OS Embed UI */
        .galaxy-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Switch Notification Popup */
        .notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #242424;
            border: 2px solid #3b3b3b;
            border-top: 4px solid #e60012;
            padding: 14px 24px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            min-width: 340px;
        }

        .notification.show {
            top: 60px;
        }

        .notification-icon {
            font-size: 26px;
        }
    </style>
</head>
<body>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="user-profile">
            <div class="avatar">N</div>
            <span style="font-weight: 500;">Player</span>
        </div>
        <div class="status-icons">
            <span>Wi-Fi</span>
            <span>🔋 100%</span>
            <div id="clock" style="font-weight: 500; min-width: 65px; text-align: right;">10:18 PM</div>
        </div>
    </div>

    <!-- Home Screen -->
    <div class="home-container" id="homeScreen">
        <div class="app-grid" id="appGrid">
            <!-- Codes App (Always Present) -->
            <div class="app-icon" onclick="openApp('codesApp')">
                <div class="icon-graphic" style="color: #ffcc00;">🔑</div>
                <span>Codes</span>
            </div>
            <!-- Galaxy OS (Hidden by default) -->
            <div class="app-icon" id="galaxyAppIcon" style="display: none;" onclick="openApp('galaxyOsApp')">
                <div class="icon-graphic" style="color: #00d2ff;">🌌</div>
                <span>Galaxy OS</span>
            </div>
        </div>
    </div>

    <!-- Switch Footer Helper Bar -->
    <div class="switch-footer">
        <div class="footer-item"><span class="footer-btn">A</span> Select</div>
        <div class="footer-item"><span class="footer-btn">+= -</span> Options</div>
        <div class="footer-item"><span class="footer-btn">HOME</span> Back to Home</div>
    </div>

    <!-- Codes App View -->
    <div class="app-view" id="codesApp">
        <div class="app-header">
            <h2 style="font-size: 18px; font-weight: 600;">Codes App</h2>
            <button class="back-btn" onclick="closeApp()"><span>◀</span> Back</button>
        </div>
        <div class="app-content">
            <div class="codes-box">
                <h2>Secret Code Entry</h2>
                <p>Enter the 4-digit code to unlock Galaxy OS.</p>
                <input type="password" id="codeInputField" class="code-input" maxlength="4" placeholder="••••">
                <button class="submit-code-btn" onclick="checkCode()">Submit Code</button>
                <div class="message" id="codeMessage"></div>
            </div>
        </div>
    </div>

    <!-- Galaxy OS App View -->
    <div class="app-view" id="galaxyOsApp">
        <div class="app-header">
            <h2 style="font-size: 18px; font-weight: 600;">Galaxy OS</h2>
            <button class="back-btn" onclick="closeApp()"><span>◀</span> Back</button>
        </div>
        <div class="app-content" style="padding: 0;">
            <iframe class="galaxy-frame" src="https://atlasos-official.github.io/Galaxy/old"></iframe>
        </div>
    </div>

    <!-- Unlock Notification -->
    <div class="notification" id="unlockNotification">
        <span class="notification-icon">✨</span>
        <div>
            <div style="font-weight: bold; font-size: 13px; color: #fff;">Software Added</div>
            <div style="font-size: 12px; color: #aaa; margin-top: 2px;">Galaxy OS is now available on the HOME Menu.</div>
        </div>
    </div>

    <script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let galaxyUnlocked = false;

        // Navigation controls
        function openApp(appId) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById(appId).style.display = 'flex';
        }

        function closeApp() {
            document.querySelectorAll('.app-view').forEach(view => {
                view.style.display = 'none';
            });
            document.getElementById('homeScreen').style.display = 'flex';
        }

        // Check secret code logic
        function checkCode() {
            const inputVal = document.getElementById('codeInputField').value;
            const msg = document.getElementById('codeMessage');

            if (inputVal === "1423") {
                msg.style.color = "#4CD137";
                msg.innerText = "Access Granted!";
                
                if (!galaxyUnlocked) {
                    galaxyUnlocked = true;
                    document.getElementById('galaxyAppIcon').style.display = 'flex';
                    showNotification();
                }

                setTimeout(() => {
                    closeApp();
                    document.getElementById('codeInputField').value = "";
                    msg.innerText = "";
                }, 1200);
            } else {
                msg.style.color = "#e60012";
                msg.innerText = "Incorrect Code. Try again.";
            }
        }

        // Trigger Nintendo Switch style top notification popup
        function showNotification() {
            const notif = document.getElementById('unlockNotification');
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 4500);
        }

        // Allow pressing 'Enter' to submit code
        document.getElementById('codeInputField').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkCode();
            }
        });
    </script>
</body>
</html>
