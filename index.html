<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Play Games Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <h1>🎮 Arcade Hub</h1>
        <p>Your ultimate destination for quick browser games. Built on GitHub Pages.</p>
    </header>

    <main class="container">
        <section class="game-grid">
            
            <div class="game-card coming-soon">
                <div class="card-badge">Launching Soon</div>
                <div class="card-content">
                    <h2>Mystery Game</h2>
                    <p>An epic new adventure is currently in development. Check back soon to play!</p>
                    <button class="play-btn disabled" disabled>Coming Soon</button>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Arcade Hub. Hosted on GitHub Pages.</p>
    </footer>

</body>
</html>
