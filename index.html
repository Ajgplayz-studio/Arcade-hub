<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub - Play Games Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <h1>🎮 Arcade Hub</h1>
        <p>Your ultimate destination for quick browser games. Built on GitHub Pages.</p>
    </header>

    <main class="container">
        <section class="game-grid">
            
            <div class="game-card">
                <div class="card-badge live">Playable</div>
                <div class="card-content">
                    <h2>Web Minecraft</h2>
                    <p>Classic block-building survival right in your browser. Mine, craft, and explore!</p>
                    <button class="play-btn" onclick="openGameModal()">Play Now</button>
                </div>
            </div>

        </section>
    </main>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGameModal()">&times;</span>
            <h2>Web Minecraft</h2>
            <div class="game-container">
                <iframe src="https://eaglercraft.com/" title="Minecraft Web Version" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Arcade Hub. Hosted on GitHub Pages.</p>
    </footer>

    <script>
        function openGameModal() {
            document.getElementById('gameModal').style.display = 'flex';
        }
        function closeGameModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            let modal = document.getElementById('gameModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
